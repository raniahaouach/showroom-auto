<div class="auto-card">
  <img src="images/{{ auto.photo }}" alt="{{ auto.brand }} {{ auto.model }}" />
  <div class="details">
    <h3>{{ auto.brand }} {{ auto.model }}</h3>
    <p>
      Power : {{ auto.power }}<br />
      Price : {{ auto.price }} DNT<br />
      Only {{ auto.availability }} units in stock
    </p>
    <div class="see-more">
      <button type="button" (click)="seeMore.emit(auto)">See more</button>
    </div>
  </div>
</div>
